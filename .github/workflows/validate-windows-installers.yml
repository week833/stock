name: Validate Windows installers

on:
  push:
    paths:
      - '*.cmd'
      - 'scripts/setup/**'
      - 'scripts/sources/**'
      - 'scripts/compat/**'
      - 'scripts/actions/**'
      - 'tests/installer/**'
      - '.env.example'
      - '.gitignore'
      - '.github/workflows/validate-windows-installers.yml'
  pull_request:
    paths:
      - '*.cmd'
      - 'scripts/setup/**'
      - 'scripts/sources/**'
      - 'scripts/compat/**'
      - 'scripts/actions/**'
      - 'tests/installer/**'
      - '.env.example'
      - '.gitignore'
      - '.github/workflows/validate-windows-installers.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse scripts and run private installer smoke checks
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tests\installer\Test-InstallerIntegration.ps1" -CiMode
          exit $LASTEXITCODE
      - name: Run semantic action self-test
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\actions\Test-StockActions.ps1"
          exit $LASTEXITCODE
